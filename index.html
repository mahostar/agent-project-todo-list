<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <style>
        body {
            padding: 20px;
        }
        .task {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Todo List</h1>
        <div class="row">
            <form id="addTaskForm">
                <div class="input-field col s6">
                    <input type="text" id="title" v-model="newTask.title" required>
                    <label for="title">Title</label>
                </div>
                <div class="input-field col s6">
                    <textarea id="description" v-model="newTask.description" class="materialize-textarea" required></textarea>
                    <label for="description">Description</label>
                </div>
                <button type="submit" class="btn waves-effect waves-light">Add Task</button>
            </form>
        </div>
        <ul id="taskList">
            <li v-for="task in tasks" :key="task.id" class="task">
                <h5>{{ task.title }}</h5>
                <p>{{ task.description }}</p>
                <label>
                    <input type="checkbox" :checked="task.completed" @change="updateTask(task.id, !task.completed)">
                    <span>Completed</span>
                </label>
            </li>
        </ul>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.2.31/vue.global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        const app = Vue.createApp({
            data() {
                return {
                    newTask: {
                        title: '',
                        description: ''
                    },
                    tasks: []
                };
            },
            methods: {
                async addTask() {
                    try {
                        const response = await fetch('/tasks', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(this.newTask)
                        });
                        const result = await response.json();
                        alert(result.message);
                        this.fetchTasks();
                        this.newTask.title = '';
                        this.newTask.description = '';
                    } catch (error) {
                        console.error('Error adding task:', error);
                    }
                },
                async fetchTasks() {
                    try {
                        const response = await fetch('/tasks');
                        const result = await response.json();
                        this.tasks = result.tasks;
                    } catch (error) {
                        console.error('Error fetching tasks:', error);
                    }
                },
                async updateTask(id, completed) {
                    try {
                        const response = await fetch(`/tasks/${id}`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ title: this.tasks.find(task => task.id === id).title, description: this.tasks.find(task => task.id === id).description, completed })
                        });
                        const result = await response.json();
                        alert(result.message);
                        this.fetchTasks();
                    } catch (error) {
                        console.error('Error updating task:', error);
                    }
                }
            },
            mounted() {
                this.fetchTasks();
                M.AutoInit();
            }
        });

        app.mount('#app');
    </script>
</body>
</html>
